<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Mall - Shops</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-store"></i> MallManager</div>
    <div class="nav-links">
        <a href="shops.html" class="active"><i class="fa-solid fa-shop"></i> Shops</a>
        <a href="products.html"><i class="fa-solid fa-box"></i> Products</a>
        <a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a>
        <a href="billing.html"><i class="fa-solid fa-receipt"></i> Billing</a>
    </div>
    <a href="#" id="logoutBtn" class="nav-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
</nav>

<header class="page-banner">
    <h1>Shops</h1>
    <p>Manage every retail space in your mall — add new shops and keep the directory up to date.</p>
</header>

<h2>Add New Shop</h2>
<form id="shopForm">
    <input type="text" id="name" placeholder="Shop Name" required>
    <input type="text" id="category" placeholder="Category" required>
    <input type="number" id="floorNumber" placeholder="Floor Number" required>
    <input type="text" id="ownerName" placeholder="Owner Name" required>
    <input type="text" id="contact" placeholder="Contact" required>
    <button type="submit">Add Shop</button>
</form>

<h2>All Shops</h2>
<table id="shopsTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Floor</th>
        <th>Owner</th>
        <th>Contact</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody id="shopsTableBody">
    <!-- Rows will be added here by JavaScript -->
    </tbody>
</table>

<script src="js/shops.js"></script>

</body>
</html>
