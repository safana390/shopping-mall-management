<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-shell">
    <aside class="auth-hero">
        <div class="auth-hero-brand"><i class="fa-solid fa-shop"></i> MallManager</div>
        <div class="auth-hero-content">
            <h1>Forgot your<br><span>password?</span></h1>
            <p>No worries — enter your registered email and we'll send you a link to reset it.</p>
        </div>
        <div class="auth-hero-footer">© 2026 MallManager. All rights reserved.</div>
    </aside>

    <main class="auth-panel">
        <div class="auth-card">
            <h2>Reset password</h2>
            <p class="auth-sub">Enter your email to receive a reset link</p>

            <form id="forgotForm">
                <label>Email</label>
                <div class="input-icon">
                    <i class="fa-solid fa-envelope leading"></i>
                    <input type="email" id="email" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="auth-submit" style="margin-top: 20px;">Send Reset Link <i class="fa-solid fa-paper-plane"></i></button>
            </form>

            <p class="auth-alt" style="margin-top: 18px;"><a href="login.html">Back to login</a></p>
            <p id="message"></p>
        </div>
    </main>
</div>

<script src="js/forgot-password.js"></script>
</body>
</html>
