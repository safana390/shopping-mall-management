<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Mall - Customers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-store"></i> MallManager</div>
    <div class="nav-links">
        <a href="shops.html"><i class="fa-solid fa-shop"></i> Shops</a>
        <a href="products.html"><i class="fa-solid fa-box"></i> Products</a>
        <a href="customers.html" class="active"><i class="fa-solid fa-users"></i> Customers</a>
        <a href="billing.html"><i class="fa-solid fa-receipt"></i> Billing</a>
    </div>
    <a href="#" id="logoutBtn" class="nav-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
</nav>

<header class="page-banner">
    <h1>Customers</h1>
    <p>Keep track of everyone who shops at your mall.</p>
</header>


<h2>Add New Customer</h2>
<form id="customerForm">
    <input type="text" id="name" placeholder="Customer Name" required>
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone">
    <button type="submit">Add Customer</button>
</form>

<h2>All Customers</h2>
<table id="customersTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody id="customersTableBody"></tbody>
</table>

<script src="js/customers.js"></script>
</body>
</html>
