<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-shell">
    <aside class="auth-hero">
        <div class="auth-hero-brand"><i class="fa-solid fa-shop"></i> MallManager</div>
        <div class="auth-hero-content">
            <h1>Set a new<br><span>password.</span></h1>
            <p>Choose a strong new password to secure your account.</p>
        </div>
        <div class="auth-hero-footer">© 2026 MallManager. All rights reserved.</div>
    </aside>

    <main class="auth-panel">
        <div class="auth-card">
            <h2>New password</h2>
            <p class="auth-sub">Enter a new password for your account</p>

            <form id="resetForm">
                <label>New Password</label>
                <div class="input-icon">
                    <i class="fa-solid fa-lock leading"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
                    <button type="button" class="toggle-pw" id="togglePw"><i class="fa-regular fa-eye"></i></button>
                </div>

                <button type="submit" class="auth-submit" style="margin-top: 20px;">Reset Password <i class="fa-solid fa-check"></i></button>
            </form>

            <p id="message"></p>
        </div>
    </main>
</div>

<script src="js/reset-password.js"></script>
</body>
</html>
