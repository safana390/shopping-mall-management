<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Mall - Billing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Shopping Mall Management</h1>

<nav>
  <a href="shops.html">Shops</a>
  <a href="products.html">Products</a>
  <a href="customers.html">Customers</a>
  <a href="billing.html">Billing</a>
  <a href="#" id="logoutBtn">Logout</a>
</nav>

<h2>Create Bill</h2>

<label>Customer:</label>
<select id="customerSelect">
  <option value="">-- Select Customer --</option>
</select>

<label>Shop:</label>
<select id="shopSelect">
  <option value="">-- Select Shop --</option>
</select>

<h3>Add Products</h3>
<select id="productSelect">
  <option value="">-- Select Product --</option>
</select>
<input type="number" id="quantity" placeholder="Quantity" min="1" value="1">
<button id="addItemBtn">Add to Bill</button>

<h3>Bill Items</h3>
<table id="billItemsTable">
  <thead>
  <tr>
    <th>Product</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Subtotal</th>
    <th>Remove</th>
  </tr>
  </thead>
  <tbody id="billItemsBody"></tbody>
</table>

<h3>Total: ₹<span id="totalAmount">0.00</span></h3>

<button id="submitBillBtn">Generate Bill</button>

<div id="billResult"></div>

<script src="js/billing.js"></script>

</body>
</html>
